[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-finance-manager"
version = "0.1.0"
description = "Local-first personal finance manager and Microsoft Money migration tool"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "platformdirs>=4.2",
  "openai>=3.57",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]
reports = ["pandas>=2.2", "matplotlib>=3.9", "openpyxl>=3.1"]

[project.scripts]
finance-manager = "finance_manager.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
